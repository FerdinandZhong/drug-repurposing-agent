# Companion deployment contract for operators and local automation.
# Cloudera AI AMP import reads .project-metadata.yaml.
api_version: "drug-repurposing.cloudera.ai/v1"
kind: "ClouderaAIProject"

metadata:
  name: "Drug Repurposing Agent"
  slug: "drug-repurposing-agent"
  description: >-
    Auditable drug-repurposing exploration using a seeded biomedical graph,
    deterministic path scoring, and agentic evidence narration.
  amp_manifest: ".project-metadata.yaml"

spec:
  runtime:
    editor: "JupyterLab"
    kernel: "Python 3.11"
    edition: "Standard"

  preparation:
    - "cai_integration/install.py"
    - "cai_integration/smoke_test.py"

  application:
    name: "Drug Repurposing Agent"
    script: "cml_app.py"
    subdomain: "drug-repurposing-agent"
    cpu: 2
    memory_gb: 4
    gpu: 0
    environment:
      TASK_TYPE: "START_APPLICATION"
      ANTHROPIC_API_KEY: "<configure in Workbench>"

  storage:
    graph: "data/seed_graph.json (read-only)"
    frontend: "frontend/dist (generated by install task)"

